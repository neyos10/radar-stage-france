name: Radar Stage France

on:
  schedule:
    - cron: "0 * * * *"      # toutes les heures, à l'heure pile
  # Le cron historique reste volontairement unique. Les fréquences définitives
  # FAST/FULL seront choisies après mesure des p95 et calcul du budget mensuel.
  workflow_dispatch:
    inputs:
      profile:
        description: Profil de scan à exécuter
        required: true
        default: full_general
        type: choice
        options:
          - fast_data_ia
          - full_general
      mode:
        description: production commite les résultats, benchmark n'écrit qu'un rapport isolé
        required: true
        default: production
        type: choice
        options:
          - production
          - benchmark
      source:
        description: Diagnostic mono-source (all = toutes les sources du profil)
        required: true
        default: all
        type: choice
        options:
          - all
          - LinkedIn Posts
          - LinkedIn
          - Indeed
          - APEC
          - Adzuna
          - France Travail
          - Google Jobs

permissions:
  contents: write

# Jamais deux scans simultanés : le suivant attend la fin du précédent
# (cancel-in-progress: false pour ne pas interrompre un scan en cours).
concurrency:
  group: radar-stage-store
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # Garde-fou quota : aucun run ne doit pouvoir consommer plus que cette
    # borne, même si une source distante ne répond plus.
    timeout-minutes: 30
    env:
      # Planifié = FULL rétrocompatible ; manuel = choix explicite des entrées.
      RADAR_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'full_general' }}
      RADAR_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'production' }}
      RADAR_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.source || 'all' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Vérification syntaxe
        run: python -m py_compile radar.py scan.py radar_io.py radar_profiles.py radar_store.py radar_xray.py radar_metrics.py budget.py scripts/analyze_scan_metrics.py

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Scan multi-sources
        env:
          # — optionnels : le scan tourne même sans (JobSpy n'a besoin de rien)
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          # — email
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          # — lien public du dashboard GitHub Pages (mis dans l'email)
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          args=(--profile "$RADAR_PROFILE")
          if [ "$RADAR_MODE" = "benchmark" ]; then
            args+=(--benchmark)
          fi
          if [ -n "$RADAR_SOURCE" ] && [ "$RADAR_SOURCE" != "all" ]; then
            args+=(--source "$RADAR_SOURCE")
          fi
          python radar.py "${args[@]}"

      - name: Commit résultats (mémoire + dashboard + statut)
        # Un benchmark n'écrit qu'un rapport isolé : rien à committer, jamais.
        if: env.RADAR_MODE != 'benchmark'
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Branche $GITHUB_REF_NAME : scan validé, résultats non persistés avant fusion."
            exit 0
          fi
          git config user.name "radar-stage-bot"
          git config user.email "actions@github.com"
          generated_files=(
            data/seen_offers.json
            data/offers.json
            data/source_status.json
            data/source_status_fast_data_ia.json
            data/source_status_full_general.json
            data/scan_metrics.json
            data/xray_state.json
            docs/index.html
          )
          for generated_file in "${generated_files[@]}"; do
            if [ -e "$generated_file" ]; then
              git add -- "$generated_file"
            fi
          done
          if git diff --quiet --cached; then
            echo "Aucun changement à committer — rien à pousser."
            exit 0
          fi
          git commit -m "Scan ${RADAR_PROFILE:-full_general} $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Push avec rebase + retry borné (jamais de force push) : évite les
          # échecs "fetch first" si main a avancé pendant le scan. data/ et
          # docs/ étant régénérés intégralement à chaque scan, un conflit sur
          # ces fichiers se résout en gardant la version du run courant.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              conflicted=$(git diff --name-only --diff-filter=U)
              echo "Conflit de rebase sur : $conflicted"
              if [ -z "$conflicted" ] || echo "$conflicted" | grep -qvE '^(data/(offers|seen_offers|source_status(_fast_data_ia|_full_general)?|scan_metrics|xray_state)\.json|docs/index\.html)$'; then
                git rebase --abort
                echo "Conflit hors fichiers générés — abandon sans force push."
                exit 1
              fi
              git checkout --theirs -- $conflicted
              git add -- $conflicted
              GIT_EDITOR=true git rebase --continue || { git rebase --abort; echo "Rebase non résolu — abandon."; exit 1; }
            fi
            if git push origin main; then
              echo "Push réussi (tentative $attempt)."
              exit 0
            fi
            echo "Push refusé (tentative $attempt), nouvel essai…"
            sleep 5
          done
          echo "Échec du push après 3 tentatives."
          exit 1
