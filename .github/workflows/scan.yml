name: Radar Stage France

on:
  # Un seul scan (pas de profils fast/full : ils n'existent que sur la
  # branche non fusionnée agent/fast-full-profiles), toutes les heures de
  # 7 h à 22 h heure de Paris, à la minute 7 pour éviter la cohue de :00.
  # Le cron GitHub est en UTC et ignore l'heure d'été :
  #   - hiver (CET = UTC+1, fin octobre → fin mars) : "7 6-21 * * *"
  #     → 7h07 … 22h07 à Paris, et à la même heure au Maroc (UTC+1 toute
  #       l'année hors ramadan, où il passe à UTC+0)
  #   - été (CEST = UTC+2, fin mars → fin octobre)  : "7 5-20 * * *"
  #     → 7h07 … 22h07 à Paris, 6h07 … 21h07 au Maroc
  # Valeur hiver retenue : la recherche du PFE (début 2027) se joue
  # d'ici fin mars. À basculer sur la valeur été le 29/03/2027.
  # Rappel billing : le dépôt est privé (2 000 min gratuites/mois). 16 runs
  # × ~10 min ≈ 4 800 min/mois : prévoir de rendre le dépôt public ou
  # d'espacer les runs, sinon les crons échouent comme en juillet 2026.
  schedule:
    - cron: "7 6-21 * * *"
  workflow_dispatch: {}       # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

# Jamais deux scans simultanés : le suivant attend la fin du précédent
# (cancel-in-progress: false pour ne pas interrompre un scan en cours).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # Garde-fou minutes : un run nominal dure ~10 min ; au-delà, quelque
    # chose boucle ou un site ralentit volontairement le scraping.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Vérification syntaxe
        run: python -m py_compile scan.py

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Scan multi-sources
        env:
          # — optionnels : le scan tourne même sans (JobSpy n'a besoin de rien)
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          # Adzuna désactivé (clé à renouveler) : la source s'affiche « non
          # configurée ». Pour la réactiver, remettre :
          #   ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          #   ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          THEMUSE_API_KEY: ${{ secrets.THEMUSE_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # — email
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          # — lien public du dashboard GitHub Pages (mis dans l'email)
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scan.py

      - name: Commit résultats (mémoire + dashboard + statut)
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Branche $GITHUB_REF_NAME : scan validé, résultats non persistés avant fusion."
            exit 0
          fi
          git config user.name "radar-stage-bot"
          git config user.email "actions@github.com"
          git add data/seen_offers.json data/offers.json data/source_status.json docs/index.html
          # linkedin_posts_rotation.json n'existe que si la source a
          # réellement tourné : ajout défensif, jamais requis.
          for rotation in data/linkedin_posts_rotation.json data/maroc_sites_rotation.json; do
            if [ -e "$rotation" ]; then
              git add "$rotation"
            fi
          done
          if git diff --quiet --cached; then
            echo "Aucun changement à committer — rien à pousser."
            exit 0
          fi
          git commit -m "Scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Push avec rebase + retry borné (jamais de force push) : évite les
          # échecs "fetch first" si main a avancé pendant le scan. data/ et
          # docs/ étant régénérés intégralement à chaque scan, un conflit sur
          # ces fichiers se résout en gardant la version du run courant.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              conflicted=$(git diff --name-only --diff-filter=U)
              echo "Conflit de rebase sur : $conflicted"
              if [ -z "$conflicted" ] || echo "$conflicted" | grep -qvE '^(data/|docs/)'; then
                git rebase --abort
                echo "Conflit hors fichiers générés — abandon sans force push."
                exit 1
              fi
              git checkout --theirs -- $conflicted
              git add -- $conflicted
              GIT_EDITOR=true git rebase --continue || { git rebase --abort; echo "Rebase non résolu — abandon."; exit 1; }
            fi
            if git push origin main; then
              echo "Push réussi (tentative $attempt)."
              exit 0
            fi
            echo "Push refusé (tentative $attempt), nouvel essai…"
            sleep 5
          done
          echo "Échec du push après 3 tentatives."
          exit 1
